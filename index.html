<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free AI Chat</title>
<meta name="description" content="WeChat-style AI chat interface using a server-side free LLM proxy.">
<style>
:root{--bg:#f3f6fb;--panel:#fff;--panel2:#f8fafc;--line:#e5e7eb;--text:#172033;--muted:#6b7280;--accent:#07c160;--accent2:#06ad55;--bubble:#fff;--me:#95ec69;--danger:#e05252;--shadow:0 14px 40px rgba(20,36,60,.10)}
*{box-sizing:border-box} body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button,input,textarea{font:inherit}button{cursor:pointer}
.app{height:100vh;display:grid;grid-template-columns:310px 1fr;min-width:0}
.sidebar{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.side-top{padding:18px 16px 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px}.logo{width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,#09d56b,#04a95a);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 5px 15px rgba(7,193,96,.25)}
.btn{border:0;border-radius:11px;padding:10px 13px;background:#eef2f7;color:var(--text);font-weight:650}.btn:hover{filter:brightness(.98)}.btn-primary{background:var(--accent);color:#fff}.new-btn{width:100%;margin-top:14px}
.search{margin-top:10px;position:relative}.search input{width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:10px;outline:none;background:var(--panel2)}.search span{position:absolute;left:11px;top:8px;color:#9ca3af}
.chat-list{padding:8px;overflow:auto;flex:1}.chat-item{display:flex;gap:10px;padding:11px 10px;border-radius:12px;align-items:center}.chat-item:hover{background:#f4f7fa}.chat-item.active{background:#eaf8ef}.avatar{width:40px;height:40px;border-radius:12px;background:#dff7e8;color:#078a4a;display:grid;place-items:center;font-weight:800;flex:0 0 auto}.chat-meta{min-width:0;flex:1}.chat-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chat-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.chat-time{font-size:11px;color:#9ca3af;align-self:flex-start}
.side-bottom{padding:12px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}.status{display:flex;align-items:center;gap:7px;padding:8px 10px;font-size:12px;color:var(--muted)}.dot{width:8px;height:8px;border-radius:50%;background:#f2a72b}.dot.ok{background:#07c160}.icon-btn{width:40px;height:40px;border:0;border-radius:10px;background:#f4f6f8}
.main{min-width:0;display:flex;flex-direction:column;background:linear-gradient(180deg,#f7f9fb,#f1f4f8)}
.header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(10px)}.header-left{display:flex;align-items:center;gap:11px}.header-title{font-weight:800}.header-sub{font-size:12px;color:var(--muted);margin-top:2px}.header-actions{display:flex;gap:8px}
.messages{flex:1;overflow:auto;padding:22px clamp(14px,4vw,56px);scroll-behavior:smooth}.day{text-align:center;color:#9aa2ad;font-size:11px;margin:8px 0 18px}.msg{display:flex;gap:9px;margin:11px 0;align-items:flex-end}.msg.me{justify-content:flex-end}.msg.me .avatar{order:2;background:#bdf2a6;color:#1e7e16}.msg-content{max-width:min(760px,78%)}.bubble{background:var(--bubble);border:1px solid #e9edf2;border-radius:14px 14px 14px 5px;padding:11px 13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 10px rgba(30,50,70,.035)}.me .bubble{background:var(--me);border-color:#8cde64;border-radius:14px 14px 5px 14px;box-shadow:none}.meta{font-size:10px;color:#9aa2ad;margin-top:4px;padding:0 2px}.me .meta{text-align:right}.bubble code{background:rgba(0,0,0,.06);padding:2px 5px;border-radius:5px}.bubble pre{background:#111827;color:#e5e7eb;padding:12px;border-radius:10px;overflow:auto}
.typing{display:inline-flex;gap:4px;align-items:center}.typing i{display:block;width:6px;height:6px;border-radius:50%;background:#84909d;animation:b 1.1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes b{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.composer-wrap{padding:14px clamp(14px,4vw,56px) 18px;background:linear-gradient(transparent,rgba(241,244,248,.97) 20%)}.composer{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:10px;display:flex;gap:8px;align-items:flex-end}.composer textarea{flex:1;min-height:42px;max-height:150px;resize:none;border:0;outline:0;padding:10px 8px;background:transparent}.send{width:44px;height:44px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-size:18px}.send:disabled{opacity:.45;cursor:not-allowed}.hint{text-align:center;font-size:10px;color:#9aa2ad;margin-top:7px}
.empty{height:100%;display:grid;place-items:center;text-align:center}.empty-card{max-width:460px;padding:30px}.empty-icon{font-size:48px}.empty h2{margin:12px 0 7px}.empty p{color:var(--muted);line-height:1.6}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.overlay.show{display:flex}.modal{background:#fff;border-radius:18px;max-width:560px;width:100%;box-shadow:0 25px 70px rgba(10,20,40,.25);padding:20px}.modal h3{margin:0 0 5px}.modal p{color:var(--muted);font-size:13px;line-height:1.5}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;outline:none}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;opacity:0;pointer-events:none;transition:.22s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mobile-menu{display:none}
@media(max-width:800px){.app{grid-template-columns:1fr}.sidebar{position:fixed;left:0;top:0;bottom:0;width:min(320px,88vw);z-index:15;transform:translateX(-105%);transition:.22s;box-shadow:0 15px 50px rgba(0,0,0,.18)}.sidebar.open{transform:translateX(0)}.mobile-menu{display:block}.header{padding:0 12px}.header-sub{display:none}.msg-content{max-width:86%}.messages{padding-left:12px;padding-right:12px}.composer-wrap{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="side-top">
      <div class="brand"><div class="logo">AI</div><div>Free AI Chat</div></div>
      <button class="btn btn-primary new-btn" id="newChat">＋ New chat</button>
      <div class="search"><span>⌕</span><input id="search" placeholder="Search chats"></div>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="side-bottom">
      <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">Not connected</span></div>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </aside>
  <main class="main">
    <header class="header">
      <div class="header-left">
        <button class="icon-btn mobile-menu" id="menuBtn">☰</button>
        <div><div class="header-title" id="headerTitle">New Chat</div><div class="header-sub">Free-model AI • via your secure Worker</div></div>
      </div>
      <div class="header-actions"><button class="icon-btn" id="clearBtn" title="Clear chat">🗑</button></div>
    </header>
    <section class="messages" id="messages"></section>
    <div class="composer-wrap">
      <div class="composer"><textarea id="input" rows="1" placeholder="Message the AI…"></textarea><button class="send" id="send" title="Send">➤</button></div>
      <div class="hint">Enter to send • Shift+Enter for a new line</div>
    </div>
  </main>
</div>

<div class="overlay" id="overlay"><div class="modal">
  <h3>Connection settings</h3>
  <p>Your OpenRouter secret should <b>never</b> be placed in this page. This app talks to your Cloudflare Worker, which keeps the secret on the server.</p>
  <div class="field"><label>Cloudflare Worker URL</label><input id="apiUrl" placeholder="https://your-worker.your-subdomain.workers.dev"></div>
  <div class="modal-actions"><button class="btn" id="closeModal">Cancel</button><button class="btn btn-primary" id="saveSettings">Save & test</button></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const STORAGE={chats:'freeAiChatsV1',api:'freeAiApiUrlV1'};
let chats=JSON.parse(localStorage.getItem(STORAGE.chats)||'[]');
let currentId=null; let busy=false;
const $=s=>document.querySelector(s); const messages=$('#messages'), input=$('#input');
function save(){localStorage.setItem(STORAGE.chats,JSON.stringify(chats))}
function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function newConversation(){const c={id:id(),title:'New Chat',messages:[],updated:Date.now()};chats.unshift(c);currentId=c.id;save();renderAll();input.focus()}
function current(){return chats.find(c=>c.id===currentId)}
function escapeHtml(s){return s.replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]))}
function formatText(s){let x=escapeHtml(s);x=x.replace(/```([\s\S]*?)```/g,'<pre>$1</pre>');x=x.replace(/`([^`]+)`/g,'<code>$1</code>');return x}
function renderList(){const q=$('#search').value.trim().toLowerCase();const list=$('#chatList');list.innerHTML='';chats.filter(c=>!q||c.title.toLowerCase().includes(q)).forEach(c=>{const d=document.createElement('div');d.className='chat-item '+(c.id===currentId?'active':'');d.innerHTML='<div class="avatar">AI</div><div class="chat-meta"><div class="chat-name"></div><div class="chat-preview"></div></div><div class="chat-time"></div>';d.querySelector('.chat-name').textContent=c.title;d.querySelector('.chat-preview').textContent=c.messages.length?c.messages[c.messages.length-1].content:'Start a new conversation';d.querySelector('.chat-time').textContent=new Date(c.updated).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});d.onclick=()=>{currentId=c.id;renderAll();$('#sidebar').classList.remove('open')};list.appendChild(d)})}
function renderMessages(){const c=current();if(!c){messages.innerHTML='<div class="empty"><div class="empty-card"><div class="empty-icon">🤖</div><h2>Free AI Chat</h2><p>Create a chat and connect it to your Cloudflare Worker. Your API key stays outside GitHub.</p><button class="btn btn-primary" onclick="newConversation()">Start chatting</button></div></div>';return}$('#headerTitle').textContent=c.title;messages.innerHTML='<div class="day">Today</div>';if(!c.messages.length){messages.innerHTML+='<div class="empty"><div class="empty-card"><div class="empty-icon">💬</div><h2>How can I help?</h2><p>Ask a question, write code, summarize text, brainstorm ideas, or simply say hello.</p></div></div>';return}c.messages.forEach(m=>{const row=document.createElement('div');row.className='msg '+(m.role==='user'?'me':'');const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=m.role==='user'?'You':'AI';const content=document.createElement('div');content.className='msg-content';content.innerHTML='<div class="bubble">'+formatText(m.content)+'</div><div class="meta">'+(m.role==='user'?'You':'AI')+' • '+new Date(m.time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</div>';row.appendChild(avatar);row.appendChild(content);messages.appendChild(row)});messages.scrollTop=messages.scrollHeight}
function renderAll(){renderList();renderMessages()}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2500)}
function setStatus(ok,text){$('#statusDot').classList.toggle('ok',ok);$('#statusText').textContent=text}
function apiBase(){return localStorage.getItem(STORAGE.api)||''}
async function testWorker(url){const r=await fetch(url.replace(/\/$/,'')+'/health',{method:'GET'});if(!r.ok)throw new Error('Worker health check failed');return r.json()}
async function send(){if(busy)return;const text=input.value.trim();if(!text)return;if(!current())newConversation();const c=current();c.messages.push({role:'user',content:text,time:Date.now()});if(c.title==='New Chat'){c.title=text.slice(0,32)+(text.length>32?'…':'')}c.updated=Date.now();input.value='';autoResize();save();renderAll();
 const url=apiBase();if(!url){toast('Add your Worker URL in ⚙ Settings');return}
 busy=true;$('#send').disabled=true;const typing=document.createElement('div');typing.className='msg';typing.id='typing';typing.innerHTML='<div class="avatar">AI</div><div class="msg-content"><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>';messages.appendChild(typing);messages.scrollTop=messages.scrollHeight;
 try{const r=await fetch(url.replace(/\/$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:c.messages.map(x=>({role:x.role==='user'?'user':'assistant',content:x.content}))})});const data=await r.json().catch(()=>({}));if(!r.ok)throw new Error(data.error||'Request failed ('+r.status+')');const reply=data.reply||data.choices?.[0]?.message?.content;if(!reply)throw new Error('The Worker returned no assistant text.');c.messages.push({role:'assistant',content:reply,time:Date.now()});c.updated=Date.now();save();setStatus(true,'Connected');
 }catch(e){c.messages.push({role:'assistant',content:'⚠️ '+e.message+'\n\nOpen ⚙ Settings and verify your Worker URL. Also confirm OPENROUTER_API_KEY is set in the Worker.',time:Date.now()});save();setStatus(false,'Connection error');toast(e.message)}finally{typing.remove();busy=false;$('#send').disabled=false;renderAll()}}
function autoResize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'}
$('#newChat').onclick=newConversation;$('#send').onclick=send;input.addEventListener('input',autoResize);input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#search').addEventListener('input',renderList);$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#clearBtn').onclick=()=>{const c=current();if(!c)return;c.messages=[];c.updated=Date.now();save();renderMessages()};
$('#settingsBtn').onclick=()=>{$('#apiUrl').value=apiBase();$('#overlay').classList.add('show')};$('#closeModal').onclick=()=>$('#overlay').classList.remove('show');$('#overlay').onclick=e=>{if(e.target===$('#overlay'))$('#overlay').classList.remove('show')};$('#saveSettings').onclick=async()=>{const url=$('#apiUrl').value.trim().replace(/\/$/,'');if(!url){toast('Enter your Worker URL');return}try{await testWorker(url);localStorage.setItem(STORAGE.api,url);setStatus(true,'Connected');$('#overlay').classList.remove('show');toast('Worker connected');}catch(e){toast('Cannot reach the Worker: '+e.message);setStatus(false,'Not connected')}};
if(!chats.length)newConversation();else{currentId=chats[0].id;renderAll()}if(apiBase()){testWorker(apiBase()).then(()=>setStatus(true,'Connected')).catch(()=>setStatus(false,'Not connected'))}
</script>
</body>
</html>
